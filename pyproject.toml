[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aosp-orch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
aosp-orch = "aosp_orch.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
